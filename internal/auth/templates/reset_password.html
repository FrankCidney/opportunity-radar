<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Opportunity Radar</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="panel auth-panel">
      <p class="eyebrow">Account recovery</p>
      <h1>Choose a new password</h1>
      {{if .Error}}<div class="form-error" role="alert">{{.Error}}</div>{{end}}
      {{if .Token}}
      <form class="auth-form" method="post" action="/reset-password">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
        <input type="hidden" name="token" value="{{.Token}}">
        <label class="field">
          <span>New password</span>
          <input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="72" required autofocus>
          <small>Use 12–72 characters. All existing sessions will be signed out.</small>
        </label>
        <button class="button button-primary" type="submit">Update password</button>
      </form>
      {{else}}
      <p class="form-error" role="alert">This reset link is incomplete.</p>
      {{end}}
      <a class="text-link" href="/forgot-password">Request a new link</a>
    </section>
  </main>
</body>
</html>
