<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Opportunity Radar</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="panel auth-panel">
      <p class="eyebrow">Account recovery</p>
      <h1>Reset your password</h1>
      <p class="lead">Enter your account email and we’ll send reset instructions if an account exists.</p>
      <form class="auth-form" method="post" action="/forgot-password">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
        <label class="field">
          <span>Email address</span>
          <input type="email" name="email" autocomplete="email" maxlength="254" required autofocus>
        </label>
        <button class="button button-primary" type="submit">Send reset instructions</button>
      </form>
      <a class="text-link" href="/login">Return to sign in</a>
    </section>
  </main>
</body>
</html>
